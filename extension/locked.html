<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productivity Lock</title>
  <link rel="stylesheet" href="locked.css">
</head>
<body>
  <main>
    <p class="eyebrow" id="progress">Wird geprüft …</p>
    <h1 id="title">Erst lernen, dann der Rest.</h1>

    <p class="banner" id="offline" hidden>
      Der Lock-Dienst läuft nicht, deshalb bleibt alles gesperrt. Starte den PC neu oder führe
      <code>install_autostart.ps1</code> aus.
    </p>

    <ul class="tasks" id="tasks"></ul>

    <template id="task-template">
      <li class="task">
        <span class="mark" aria-hidden="true"></span>
        <div class="grow">
          <h2 class="task-title"></h2>
          <p class="detail"></p>
          <p class="error check-error" hidden></p>
          <p class="hint hint-text" hidden></p>
          <a class="hint hint-link" target="_blank" rel="noreferrer" hidden></a>
          <p class="timer" hidden></p>
          <button class="start" type="button" hidden>Timer starten</button>
          <form class="note-form" hidden>
            <label class="note-label"></label>
            <textarea class="note" rows="2" maxlength="1000"></textarea>
            <p class="error note-error" hidden></p>
            <button type="submit">Abschließen</button>
          </form>
        </div>
      </li>
    </template>

    <div class="links" id="links" hidden>
      <a class="primary" href="https://www.youtube.com/">YouTube öffnen</a>
      <a class="primary" href="https://www.netflix.com/">Netflix öffnen</a>
      <a class="primary" href="https://www.instagram.com/">Instagram öffnen</a>
    </div>

    <button class="quiet" id="refresh" type="button">Jetzt prüfen</button>

    <section class="joker" id="joker" hidden>
      <p id="joker-info"></p>
      <button class="quiet" id="joker-open" type="button" hidden>Joker einsetzen</button>
      <form id="joker-form" hidden>
        <label for="joker-reason">Warum brauchst du heute den Joker?</label>
        <input id="joker-reason" type="text" maxlength="200" autocomplete="off">
        <p class="error" id="joker-error" hidden></p>
        <button type="submit">Heute freigeben</button>
        <button class="quiet" id="joker-cancel" type="button">Abbrechen</button>
      </form>
    </section>

    <section class="history" id="history" hidden>
      <h2>Verlauf</h2>
      <p class="stats"><strong id="streak"></strong> <span id="best"></span></p>
      <p class="week" id="week"></p>
      <div class="month-nav">
        <button class="nav" id="month-prev" type="button" aria-label="Voriger Monat">‹</button>
        <span id="month-label"></span>
        <button class="nav" id="month-next" type="button" aria-label="Nächster Monat">›</button>
      </div>
      <div class="calendar" id="calendar"></div>
      <ul class="legend">
        <li><span class="swatch done"></span>Geschafft</li>
        <li><span class="swatch joker-day"></span>Joker</li>
        <li><span class="swatch partial"></span>Teilweise</li>
      </ul>
    </section>
  </main>
  <script src="locked.js"></script>
</body>
</html>
